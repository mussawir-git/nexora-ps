<!DOCTYPE html>
<html lang="en">
<head>

  <title>NEXORA'26 — Problem Statement Reveal</title>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(16, 24, 40, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #22d3ee;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Ambient glow elements */
    .glow-circle {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: var(--primary-glow);
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      border: 1px solid rgba(34, 211, 238, 0.3);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }

    button {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      font-weight: 600;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px var(--primary-glow);
    }

    /* Result Animation */
    .result-box {
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      margin-top: 1rem;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(34, 211, 238, 0.1);
      border: 1px dashed rgba(34, 211, 238, 0.4);
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .theme-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .statement-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.95rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
