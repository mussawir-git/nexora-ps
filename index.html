<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXORA'26 — Problem Statement Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(16, 24, 40, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #22d3ee;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      border: 1px solid rgba(34, 211, 238, 0.3);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.3);
    }

    button {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Result Card */
    #resultBox {
      display: none;
      margin-top: 1.75rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .team-badge {
      display: inline-block;
      color: #a5b4fc;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }

    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(34, 211, 238, 0.1);
      border: 1px dashed rgba(34, 211, 238, 0.4);
      display: inline-block;
      padding: 0.4rem 1.2rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .theme-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 14px;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.85rem;
    }

    .statement-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">NEXORA '26 Hackathon</div>
    <h1>Problem Statement Reveal</h1>
    <p class="subtitle">Enter your Team Number (1 – 33) to unlock your statement</p>

    <div class="card">
      <div class="input-group">
        <input 
          type="number" 
          id="teamInput" 
          placeholder="Enter Team No (e.g. 1 to 33)" 
          min="1" 
          max="33"
        />
        <button type="button" id="unlockBtn">Unlock</button>
      </div>

      <div id="errorMsg" class="error-msg">Please enter a valid Team Number between 1 and 33.</div>

      <div id="resultBox">
        <span class="team-badge" id="assignedTeam">Assigned to Team</span><br />
        <div class="code-badge" id="psCode">NX2601</div><br />
        <span class="theme-pill" id="psTheme">Theme Sector</span>
        <h2 class="statement-title" id="psTitle">Problem Statement</h2>
      </div>
    </div>
  </div>

  <script>
    const problemStatements = [
      { code: "NX2601", sector: "Retail & Small Business", title: "AI-Powered Small-Business Demand Forecaster" },
      { code: "NX2602", sector: "Education", title: "ML-Based Student Support Early-Warning Dashboard" },
      { code: "NX2603", sector: "Water & Environment", title: "AI-Based Urban Flood Hotspot Predictor" },
      { code: "NX2604", sector: "Disaster Recovery", title: "Damage Report Triage and Recovery Prioritizer" },
      { code: "NX2605", sector: "Agriculture & Food Systems", title: "AI-Assisted Irrigation Scheduling" },
      { code: "NX2606", sector: "Waste Management", title: "ML-Based Waste Sorting Helper" },
      { code: "NX2607", sector: "IoT", title: "IoT Smart Cold-Storage Failure Predictor" },
      { code: "NX2608", sector: "Food Redistribution", title: "AI Food-Surplus Rescue Matcher" },
      { code: "NX2609", sector: "Private Sector", title: "AI Workplace Near-Miss Pattern Analyzer" },
      { code: "NX2610", sector: "Tourism & Heritage", title: "AI-Powered Heritage Site Crowd and Wear Monitor" },
      { code: "NX2611", sector: "Agriculture & Food Systems", title: "ML-Powered Crop Residue Value Matcher" },
      { code: "NX2612", sector: "Emergency Response", title: "Offline-First Emergency Resource Prioritizer" },
      { code: "NX2613", sector: "Information Integrity", title: "Evidence-Aware Misinformation Context Tracker" },
      { code: "NX2614", sector: "Public Transport", title: "AI-Assisted Public Transport Crowd Estimator" },
      { code: "NX2615", sector: "Cybersecurity", title: "Phishing Message Pattern Detector for Regional Languages" },
      { code: "NX2616", sector: "Agriculture & Food Systems", title: "AI-Based Post-Harvest Spoilage Risk Predictor" },
      { code: "NX2617", sector: "IoT", title: "AI-Based Smart Water-Leak Detection" },
      { code: "NX2618", sector: "Agriculture & Food Systems", title: "Harvest Readiness and Logistics Planner" },
      { code: "NX2619", sector: "Healthcare Operations", title: "Smart Clinic Appointment No-Show Predictor" },
      { code: "NX2620", sector: "Accessibility", title: "AI-Assisted Accessibility Issue Reporter" },
      { code: "NX2621", sector: "Accessibility", title: "AI Accessibility Document Simplifier" },
      { code: "NX2622", sector: "E-Waste & Sustainability", title: "ML-Based E-Waste Repairability Recommender" },
      { code: "NX2623", sector: "Private Sector", title: "AI Knowledge-Handover Assistant" },
      { code: "NX2624", sector: "Agriculture & Food Systems", title: "Crop Leaf Disease Screening with Confidence" },
      { code: "NX2625", sector: "Private Sector", title: "ML-Based Supplier Disruption Risk Predictor" }
    ];

    function revealProblem() {
      const inputEl = document.getElementById("teamInput");
      const errorMsg = document.getElementById("errorMsg");
      const resultBox = document.getElementById("resultBox");

      const val = parseInt(inputEl.value, 10);

      // Validation
      if (isNaN(val) || val < 1 || val > 33) {
        errorMsg.style.display = "block";
        resultBox.style.display = "none";
        return;
      }

      errorMsg.style.display = "none";

      // Modulo 25 mapping
      const statementIndex = (val - 1) % problemStatements.length;
      const statement = problemStatements[statementIndex];

      document.getElementById("assignedTeam").innerText = "Assigned to Team " + val;
      document.getElementById("psCode").innerText = statement.code;
      document.getElementById("psTheme").innerText = statement.sector;
      document.getElementById("psTitle").innerText = statement.title;

      // Force display
      resultBox.style.display = "block";
    }

    // Attach click and enter key listeners
    document.getElementById("unlockBtn").addEventListener("click", revealProblem);
    document.getElementById("teamInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        revealProblem();
      }
    });
  </script>
</body>
</html>
